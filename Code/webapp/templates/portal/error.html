{% extends "base.html" %}
{% load portal_tags %}
{% block title %}{{ title }} · Advance Search{% endblock %}
{% block content %}
<div class="container page">
  <div class="empty-state error-page">
    <p class="error-code">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn-primary" href="{% url 'portal:search' %}">{% icon 'search' 18 %}<span>Back to search</span></a>
  </div>
</div>
{% endblock %}
