[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advancesearch-core"
version = "1.0.0"
description = "Extraction, chunking, embeddings, index and search for the Advance Search solution"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "azure-search-documents>=11.6",
]
# Faster cosine similarity for the local index only. The web app package never needs it.
local = ["numpy>=1.26"]

[project.scripts]
advancesearch = "advancesearch.cli:main"

[tool.setuptools.packages.find]
include = ["advancesearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
